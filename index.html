<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>我们的家</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:,">
</head>
<body>

<div id="header">
  <span id="dot"></span>
  <span id="title">我们的家</span>
  <button id="clear-btn">清空</button>
</div>

<div id="chat-box"></div>

<div id="panel">
  <div id="tabs"></div>
  <div id="grid"></div>
</div>

<!-- 图片预览区域 -->
<div id="img-preview-wrap" style="padding: 8px 12px;display: none;">
  <img id="preview-img" style="max-width: 160px;max-height: 160px;border-radius:8px;">
  <span id="cancel-img" style="margin-left:8px;color:#f55;cursor:pointer;">取消</span>
</div>

<div id="input-area">
  <button id="emoji-btn" class="circle">&#9786;</button>
  <!-- 图片上传按钮 -->
  <button id="img-upload-btn" class="circle">🖼️</button>
  <input type="file" id="img-file-input" accept="image/*" style="display: none;">
  <textarea id="input" placeholder="说点什么..." rows="1"></textarea>
  <button id="send-btn" class="circle">&#8593;</button>
</div>

<script src="emoji.js"></script>
<script src="ui.js"></script>

</body>
</html>
