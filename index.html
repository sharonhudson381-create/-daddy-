<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们的家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f0eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #header {
      width: 100%;
      max-width: 680px;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 600;
      color: #5a3e36;
      text-align: center;
      letter-spacing: 0.5px;
    }

    #chat-box {
      flex: 1;
      width: 100%;
      max-width: 680px;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      background: #c8a98a;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      background: #fff;
      color: #3a3a3a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .msg.thinking {
      background: #fff;
      color: #aaa;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      font-style: italic;
      font-size: 14px;
    }

    #input-area {
      width: 100%;
      max-width: 680px;
      padding: 12px 16px 24px;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      background: #fff;
      resize: none;
      max-height: 120px;
      font-family: inherit;
    }

    #input:focus { border-color: #c8a98a; }

    #send-btn {
      background: #c8a98a;
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      align-self: flex-end;
    }

    #send-btn:hover { background: #b8957a; }
  </style>
</head>
<body>

<div id="header">我们的家</div>

<div id="chat-box"></div>

<div id="input-area">
  <textarea id="input" placeholder="说点什么..." rows="1"></textarea>
  <button id="send-btn">↑</button>
</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  let history = JSON.parse(localStorage.getItem('chat_history') || '[]');
let accessPassword = localStorage.getItem('access_password') || '';

    function ensurePassword() {
      if (!accessPassword) {
        accessPassword = (prompt('请输入口令') || ').trim();
        if (accessPassword) localStorage.setItem('access_password', accessPassword);
      }
      return accessPassword;
    }

  function render() {
    chatBox.innerHTML = '';
    history.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
      div.textContent = m.content;
      chatBox.appendChild(div);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'msg thinking';
    div.id = 'thinking';
    div.textContent = '正在输入...';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeThinking() {
    const t = document.getElementById('thinking');
    if (t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    render();
    addThinking();

    try {
      const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-access-password': ensurePassword()
          },
          body: JSON.stringify({ messages: history })
        });
  
        const data = await res.json();
        removeThinking();

        if (res.status === 401) {
          localStorage.removeItem('access_password');
          accessPassword = '';
          history.push({ role: 'assistant', content: '口令不对，刷新页面重新输入。' });
          render();
          return;
        }

        const reply = data?.content?.[0]?.text
    || ('出错了：' + (typeof data?.error === 'string' ? data.error : JSON.stringify(data)));
      history.push({ role: 'assistant', content: reply });
      localStorage.setItem('chat_history', JSON.stringify(history));
      render();
    } catch (e) {
      removeThinking();
      history.push({ role: 'assistant', content: '网络出错了。' });
      render();
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  });

  render();
</script>

</body>
</html>
